name: tests
on:
  push:
    paths-ignore:            # a change of text only has nothing to test; a release still runs everything
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_call:             # the release workflow runs these same tests and publishes only if they pass

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # the tests use synthetic landmarks and need no camera, so only numpy, Pillow and pytest are installed
      - run: python -m pip install numpy "Pillow" pynput pytest
      # tests/test_overlay.py is left out on purpose: it imports core.tracker, ui.overlay and tests.test_gestures, which do not exist in this layout
      - run: python -m pytest -q tests/test_signs.py tests/test_release.py tests/test_updater.py tests/test_mouse_clicks.py
