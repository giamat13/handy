name: tests
on:
  push:
    paths-ignore:            # a change of text only has nothing to test; a release still runs everything
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_call:             # the release workflow runs these same tests and publishes only if they pass

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # the tests use synthetic landmarks and need no camera, so only numpy, Pillow, OpenCV (drawing) and pytest are installed
      - run: python -m pip install numpy "Pillow" pynput pytest opencv-python-headless
      # tests/test_overlay.py is left out on purpose: it imports core.tracker, ui.overlay and tests.test_gestures, which do not exist in this layout
      # tests/test_tracker.py needs mediapipe (heavy); it skips itself here and runs where mediapipe is installed
      - run: python -m pytest -q tests/test_signs.py tests/test_release.py tests/test_updater.py tests/test_mouse_clicks.py tests/test_settings.py tests/test_commands.py tests/test_custom_gestures.py tests/test_head_gestures.py tests/test_head_motion.py tests/test_diagnostics.py tests/test_view_aids.py tests/test_tray.py tests/test_webui.py tests/test_tracker.py

  # The same logic tests on Linux and macOS. They report whether the code works there, but do not block a release:
  # the release gate is the Windows job above (the updater and the installers are Windows-only).
  test-other-platforms:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy "Pillow" pynput pytest opencv-python-headless
      - name: Run the tests (Linux needs a virtual display for pynput)
        shell: bash
        run: |
          tests="tests/test_signs.py tests/test_mouse_clicks.py tests/test_settings.py tests/test_commands.py tests/test_custom_gestures.py tests/test_head_gestures.py tests/test_head_motion.py tests/test_diagnostics.py tests/test_view_aids.py tests/test_tray.py tests/test_webui.py"
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run -a python -m pytest -q $tests
          else
            python -m pytest -q $tests
          fi
