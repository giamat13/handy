name: release
# Push a tag like v2.1.0 (it must equal version.py) to build Handy2Setup.exe and the portable ZIP and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # run it by hand on main: the tag vX.Y.Z (from version.py) is created by the release itself
    inputs:
      prerelease:
        description: "Mark as a pre-release (tag vX.Y.Z-beta.N, flagged on GitHub)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tests:
    # the same tests that run on every push, now INSIDE the release: nothing is published unless they pass
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Tag matches version.py
        shell: bash
        run: |
          v=$(python -c "from version import __version__ as v; print(v)")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${{ inputs.prerelease }}" != "true" ]; then
            [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: "A PRE build knows its PRE number (_prerelease.py; nothing for a regular release)"
        shell: bash
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/write_prerelease.py
      - run: python tools/make_icon.py
      - run: python tools/make_version_info.py
      - run: python -m PyInstaller --noconfirm Handy2.spec
      - name: Build the portable ZIP (no installer - runs from a USB stick or any folder)
        run: python tools/make_portable.py
      - run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=%VERSION% installer.iss'
      - name: Keep the release files for the publish job
        shell: bash
        run: |
          mkdir release_files
          cp installer_output/Handy2Setup.exe dist/Handy2-*-portable.zip release_files/
          ls -la release_files
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release_files/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [tests, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release_files
      - name: Publish the release (its body is docs/release-notes-vX.Y.Z.md)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "from version import __version__ as v; print(v)")
          TAG="v${VERSION}"
          TITLE="Handy 2 ${VERSION}"
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            # a pre-release is "PRE N" of the version in version.py: the tag is vX.Y.Z-beta.N, N = the highest existing number + 1
            last=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${VERSION}-beta." --jq '[.[].ref | capture("-beta\\.(?<n>[0-9]+)$").n | tonumber] | (max // 0)')
            PRE=$((last + 1))
            TAG="v${VERSION}-beta.${PRE}"
            TITLE="Handy 2 ${VERSION} (pre ${PRE})"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${{ inputs.prerelease }}" != "true" ]; then
            [ "$TAG" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version $TAG"; exit 1; }
          fi
          notes=docs/release-notes-v${VERSION}.md
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          flags=()
          [ "${{ inputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          gh release create "${TAG}" --target "${GITHUB_SHA}" release_files/* --title "${TITLE}" "${notes_args[@]}" "${flags[@]}"
