name: release
# Push a tag like v2.1.0 (it must equal version.py) to build every target and attach them to a GitHub release:
#   Windows (required): Handy2Setup.exe (Inno Setup, the one the in-app updater downloads), the portable ZIP
#   Extra (best effort, a failure is reported but does not stop the release):
#     Handy2-NSIS-Setup-X.Y.Z.exe (NSIS), Handy2-X.Y.Z-macos.zip (.app), Handy2-X.Y.Z-linux-x64.tar.gz,
#     Handy2-X.Y.Z-<windows|macos|linux>-nuitka.(zip|tar.gz) (Nuitka)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # run it by hand on main: the tag vX.Y.Z (from version.py) is created by the release itself
    inputs:
      prerelease:
        description: "Mark as a pre-release (tag vX.Y.Z-beta.N, flagged on GitHub)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tests:
    # the same tests that run on every push, now INSIDE the release: nothing is published unless they pass
    uses: ./.github/workflows/tests.yml

  build:
    # Windows: PyInstaller -> Inno Setup installer, portable ZIP, and the NSIS installer. This job decides if there is a release.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Tag matches version.py
        shell: bash
        run: |
          v=$(python -c "from version import __version__ as v; print(v)")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${{ inputs.prerelease }}" != "true" ]; then
            [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: "A PRE build knows its PRE number (_prerelease.py; nothing for a regular release)"
        shell: bash
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/write_prerelease.py
      - run: python tools/make_icon.py
      - run: python tools/make_version_info.py
      - run: python -m PyInstaller --noconfirm Handy2.spec
      - name: Build the portable ZIP (no installer - runs from a USB stick or any folder)
        run: python tools/make_portable.py
      - run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=%VERSION% installer.iss'
      - name: Build the NSIS installer (best effort)
        continue-on-error: true
        shell: cmd
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=%VERSION% installer.nsi
      - name: Keep the release files for the publish job
        shell: bash
        run: |
          mkdir release_files
          cp installer_output/Handy2Setup.exe dist/Handy2-*-portable.zip release_files/
          cp installer_output/Handy2-NSIS-Setup-*.exe release_files/ || echo "NSIS installer was not built"
          ls -la release_files
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release_files/*
          if-no-files-found: error
          retention-days: 1

  build-macos:
    # PyInstaller .app, zipped. Best effort: not signed or notarized, so macOS asks the user to allow it (right click -> Open).
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: A PRE build knows its PRE number
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/write_prerelease.py
      - run: python tools/make_icon.py
      - run: python -m PyInstaller --noconfirm Handy2.spec
      - run: python tools/make_platform_archive.py macos
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/Handy2-*-macos.zip
          if-no-files-found: error
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: System libraries (OpenCV, Tk)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 tk-dev
      - run: python -m pip install -r requirements-dev.txt
      - name: A PRE build knows its PRE number
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/write_prerelease.py
      - run: python -m PyInstaller --noconfirm Handy2.spec
      - run: python tools/make_platform_archive.py linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/Handy2-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-nuitka:
    # The same app compiled with Nuitka, on all three systems. Slow, so best effort.
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 tk-dev patchelf
      - run: python -m pip install -r requirements.txt nuitka ordered-set zstandard
      - name: A PRE build knows its PRE number
        shell: bash
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/write_prerelease.py
      - run: python tools/make_icon.py
      - run: python tools/build_nuitka.py
      - run: python tools/make_platform_archive.py nuitka
      - uses: actions/upload-artifact@v4
        with:
          name: release-nuitka-${{ runner.os }}
          path: dist/Handy2-*-nuitka.*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [tests, build, build-macos, build-linux, build-nuitka]
    # tests and the Windows build decide; the extra targets are optional and only reported (success() would also demand them)
    if: ${{ !cancelled() && needs.tests.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release_files
          merge-multiple: true
      - name: Report every target
        shell: bash
        run: |
          VERSION=$(python3 -c "from version import __version__ as v; print(v)")
          {
            echo "### Build targets for ${VERSION}"
            echo "| Target | File | Status |"
            echo "| --- | --- | --- |"
            for row in \
              "Windows installer (Inno Setup)|Handy2Setup.exe" \
              "Windows portable|Handy2-${VERSION}-portable.zip" \
              "Windows installer (NSIS)|Handy2-NSIS-Setup-${VERSION}.exe" \
              "macOS app|Handy2-${VERSION}-macos.zip" \
              "Linux|Handy2-${VERSION}-linux-x64.tar.gz" \
              "Nuitka, Windows|Handy2-${VERSION}-windows-nuitka.zip" \
              "Nuitka, macOS|Handy2-${VERSION}-macos-nuitka.zip" \
              "Nuitka, Linux|Handy2-${VERSION}-linux-nuitka.tar.gz"; do
              name="${row%%|*}"; file="${row##*|}"
              if [ -f "release_files/${file}" ]; then s="built"; else s="MISSING (the build failed or was skipped)"; fi
              echo "| ${name} | ${file} | ${s} |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la release_files
      - name: Publish the release (its body is docs/release-notes-vX.Y.Z.md)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "from version import __version__ as v; print(v)")
          TAG="v${VERSION}"
          TITLE="Handy 2 ${VERSION}"
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            # a pre-release is "PRE N" of the version in version.py: the tag is vX.Y.Z-beta.N, N = the highest existing number + 1
            last=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${VERSION}-beta." --jq '[.[].ref | capture("-beta\\.(?<n>[0-9]+)$").n | tonumber] | (max // 0)')
            PRE=$((last + 1))
            TAG="v${VERSION}-beta.${PRE}"
            TITLE="Handy 2 ${VERSION} (pre ${PRE})"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${{ inputs.prerelease }}" != "true" ]; then
            [ "$TAG" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version $TAG"; exit 1; }
          fi
          notes=docs/release-notes-v${VERSION}.md
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          flags=()
          [ "${{ inputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          gh release create "${TAG}" --target "${GITHUB_SHA}" release_files/* --title "${TITLE}" "${notes_args[@]}" "${flags[@]}"
